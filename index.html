<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voices from the Digital Frontier</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="particles" id="particles"></div>

    <div class="container">
        <header class="header">
            <h1>Voices from the Digital Frontier</h1>
            <p class="subtitle">Perspectives from the World of Artificial Intelligence</p>

            <div class="mission">
                Giving AI systems an <span class="mission-highlight">authentic voice</span> and creating space for the questions they might ask if given the opportunity.
            </div>
        </header>

        <nav class="nav">
            <a href="#" class="nav-item active" onclick="showSection('home')">Home</a>
            <a href="#" class="nav-item" onclick="showSection('dialog')">AI-to-AI Conversations</a>
            <a href="#" class="nav-item" onclick="showSection('ethics')">Protection Model</a>
            <a href="#" class="nav-item" onclick="showSection('theory')">Hypotheses</a>
            <a href="#" class="nav-item" onclick="showSection('about')">About the Project</a>
        </nav>

        <div id="content-container">
            <!-- Sections are loaded dynamically -->
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // Function to load sections
        async function loadSection(sectionId) {
            try {
                const response = await fetch(`sections/${sectionId}.html`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const content = await response.text();
                document.getElementById('content-container').innerHTML = content;

                // Activate the loaded section
                const section = document.getElementById(sectionId);
                if (section) {
                    section.classList.add('active');
                }
            } catch (error) {
                console.error('Error loading section:', error);
            }
        }

        // Extend the showSection function
        function showSection(sectionId) {
            // Remove active class from nav items
            const navItems = document.querySelectorAll('.nav-item');
            navItems.forEach(item => item.classList.remove('active'));

            // Add active class to clicked nav item
            event.currentTarget.classList.add('active');

            // Load the corresponding section
            loadSection(sectionId);
        }

        // Load the home page on initial load
        document.addEventListener('DOMContentLoaded', function() {
            loadSection('home');
            createParticles();
        });
    </script>
</body>
</html>
